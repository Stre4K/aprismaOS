name: AprismaOS Build Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Build the i386 kernel on AMD64 (full build)
  build-kernel-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull toolchain
        run: docker pull stre4k/aprisma:latest
      - name: Build kernel (amd64)
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace \
            stre4k/aprisma:latest \
            sh aprisma.sh --compiler i686-elf-gcc --build iso

      - name: Upload kernel artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-amd64
          path: |
            build/AprismaOS/sysroot/boot/aprisma.kernel
            build/AprismaOS/sysroot/boot/initrd.tar

      - name: Upload ISO artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: iso-amd64
          path: build/aprisma.iso

  # 0. Host-side unit tests (libc and pure kernel helpers, host gcc)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make -C tests/unit

  # 1b. Build the x86_64 kernel on AMD64 (full build)
  build-kernel-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull toolchain
        run: docker pull stre4k/aprisma:latest
      - name: Build kernel (x86_64)
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace \
            stre4k/aprisma:latest \
            sh aprisma.sh --compiler x86_64-elf-gcc --build iso

      - name: Upload kernel artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86_64
          path: |
            build/AprismaOS/sysroot/boot/aprisma.kernel
            build/AprismaOS/sysroot/boot/initrd.tar

      - name: Upload ISO artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: iso-x86_64
          path: build/aprisma.iso

        # 2. Build kernel on ARM64 (toolchain-only)
  build-kernel-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Pull toolchain
        run: docker pull stre4k/aprisma:latest
      - name: Build kernel (arm64 - toolchain only)
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace \
            stre4k/aprisma:latest \
            sh aprisma.sh --compiler i686-elf-gcc --build kernel

      - name: Upload kernel artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: |
            build/AprismaOS/sysroot/boot/aprisma.kernel
            build/AprismaOS/sysroot/boot/initrd.tar

  # 3. macOS build (native + ISO)
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (brew)
        run: |
          brew update
          brew install make xorriso qemu i686-elf-binutils i686-elf-gcc i686-elf-grub
      - name: Build kernel + ISO (macOS)
        #run: sh aprisma.sh --build iso --homebrew-grub
        run: sh aprisma.sh --compiler i686-elf-gcc --default

      - name: Upload kernel artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-macos
          path: |
            build/AprismaOS/sysroot/boot/aprisma.kernel
            build/AprismaOS/sysroot/boot/initrd.tar

      - name: Upload ISO artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: iso-macos
          path: build/aprisma.iso

  # 4. Smoke test: fake ISO creation with grub container (no artifact)
  iso-test-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fake ISO build
        run: |
          docker pull stre4k/aprisma:grub-22.04
          docker run --rm -v $PWD:/workspace -w /workspace \
            stre4k/aprisma:grub-22.04 \
            sh -c 'mkdir -p build/isodir/boot/grub && touch build/isodir/boot/aprisma.kernel && printf "menuentry \"Aprisma\" {\n  multiboot /boot/aprisma.kernel\n}\n" > build/isodir/boot/grub/grub.cfg && grub-mkrescue -o build/aprisma.iso build/isodir'

  # 5. Real ISO build (arm64): uses artifact from build-kernel-arm64
  build-iso-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build-kernel-arm64
    steps:
      - uses: actions/checkout@v4

      # Download the ARM64 kernel artifact
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-arm64
          path: build/AprismaOS/sysroot/boot

       # Set up QEMU so ARM can run x86_64 containers
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      # Pull and run the GRUB container under emulation
      - name: Create real ISO with GRUB container
        run: |
          docker pull --platform linux/amd64 stre4k/aprisma:grub-22.04
          docker run --platform linux/amd64 --rm -v $PWD:/workspace -w /workspace \
            stre4k/aprisma:grub-22.04 \
            sh -c 'mkdir -p build/isodir/boot/grub && cp build/AprismaOS/sysroot/boot/aprisma.kernel build/AprismaOS/sysroot/boot/initrd.tar build/isodir/boot/ && printf "menuentry \"Aprisma\" {\n  multiboot /boot/aprisma.kernel\n  module /boot/initrd.tar\n}\n" > build/isodir/boot/grub/grub.cfg && grub-mkrescue -o build/aprisma.iso build/isodir'

      # Upload the resulting ISO
      - name: Upload ISO artifact (arm64 GRUB)
        uses: actions/upload-artifact@v4
        with:
          name: iso-arm64-grub
          path: build/aprisma.iso

  # -----------------------------
  # Artifact Sanity Test Matrix
  # -----------------------------
  qemu-boot-test:
    runs-on: ubuntu-latest
    needs: [build-kernel-amd64, build-kernel-x86_64, build-kernel-arm64, build-macos, build-iso-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: iso-amd64
            is_iso: true
            arch: i386
          - artifact: kernel-amd64
            is_iso: false
            arch: i386
          - artifact: iso-x86_64
            is_iso: true
            arch: x86_64
          - artifact: kernel-x86_64
            is_iso: false
            arch: x86_64
          - artifact: iso-arm64-grub
            is_iso: true
            arch: i386
          - artifact: kernel-arm64
            is_iso: false
            arch: i386
          - artifact: iso-macos
            is_iso: true
            arch: i386
          - artifact: kernel-macos
            is_iso: false
            arch: i386

    steps:
      - uses: actions/checkout@v4

      # Download artifact
      - name: Download ${{ matrix.artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # Set up QEMU so ARM can run x86_64 containers
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - id: disable-man-pages
        name: Disable man pages
        run: sudo rm -f /var/lib/man-db/auto-update
        shell: bash

      # Install lightweight inspection tools
      - name: Install inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils \
            genisoimage \
            grub-pc-bin \
            qemu-system-x86 \
            qemu-utils

      # Inspect the artifact
      - name: Sanity check ${{ matrix.artifact }}
        run: |
          FILE_DIR=${{ matrix.artifact }}
          if [ "${{ matrix.is_iso }}" = "true" ]; then
            FILE="$FILE_DIR/aprisma.iso"

            echo "📦 Inspecting ISO: $FILE"
            file "$FILE" || (echo "❌ ISO file is invalid" && exit 1)
            isoinfo -i "$FILE" -d || (echo "❌ ISO header invalid" && exit 1)
            echo "📁 ISO contents:"
            isoinfo -i "$FILE" -l | head -n 40

          else
            FILE="$FILE_DIR/aprisma.kernel"

            echo "🧪 Inspecting kernel ELF: $FILE"
            file "$FILE" || (echo "❌ Kernel file is invalid" && exit 1)
            readelf -h "$FILE" || (echo "❌ ELF headers invalid" && exit 1)

            echo "🔎 Checking multiboot header..."
            if grub-file --is-x86-multiboot "$FILE"; then
              echo "✅ Kernel is multiboot-compatible"
            else
              echo "⚠️  Kernel is not multiboot-compatible"
            fi
          fi

          if [ "${{ matrix.is_iso }}" != "true" ]; then
            echo "🔍 Checking embedded signature"
            if strings "$FILE" | grep -q "AprismaKernelSignature_v1"; then
              echo "✅ Found embedded signature (AprismaKernelSignature_v1)"
            else
              echo "❌ Embedded signature missing!"
              exit 1
            fi

            echo "🔍 Checking .signature section"
            if command -v objdump >/dev/null 2>&1; then
                echo "🔎 Dumping .signature section:"
                objdump -s -j .signature "$FILE" || true
                if objdump -s -j .signature "$FILE" 2>/dev/null | grep -a "AprismaSectionV1"; then
                    echo "✅ Found .signature section with AprismaSectionV1"
                else
                    echo "⚠️ .signature section not found in kernel"
                    exit 1
                fi
            else
                echo "⚠️ objdump not available, trying readelf"
                if readelf -x .signature "$FILE" 2>/dev/null | grep -a "AprismaSectionV1"; then
                    echo "✅ Found .signature section via readelf"
                else
                    echo "❌ .signature section missing (and objdump not available)"
                    exit 1
                fi
            fi
          fi

      # Boot the artifact in QEMU and check what the kernel prints
      - name: Boot test ${{ matrix.artifact }}
        run: |
          if [ "${{ matrix.is_iso }}" = "true" ]; then
            IMAGE="--iso ${{ matrix.artifact }}/aprisma.iso"
          else
            IMAGE="--kernel ${{ matrix.artifact }}/aprisma.kernel"
          fi
          # User mode only exists on x86_64 so far
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            set -- --run "run hello" "Hello from user mode!" --run "test user" "user test: [0-9]+ wakeups during spin, passed" \
                   --run "run args one two three" "argv\[3\]=three" --run "run cat /etc/motd" "cat\] exited with code 0"
          fi
          python3 scripts/qemu_boot_test.py --arch ${{ matrix.arch }} $IMAGE --timeout 120 --check-serial "$@" \
            --run "cat /etc/motd" "Welcome to AprismaOS!" \
            --run "test threads" "threads test: [0-9]+ spinner loops while preempted, passed" \
            --run "test heap" "heap test: peak heap [0-9]+ KB, passed" \
            --run "test timer" "timer test: [0-9]+ ticks during the command, passed" \
            --run "test scroll" "scroll line 1499\nscroll test done" \
            --run "version" "AprismaOS v[^ ]+ \(${{ matrix.arch == 'x86_64' && 'x86_64' || 'i686' }}\)"

      # With the ramdisk, x86_64 boots into the user-space shell /bin/sh
      - name: User shell test ${{ matrix.artifact }}
        if: ${{ !matrix.is_iso && matrix.arch == 'x86_64' }}
        run: |
          python3 scripts/qemu_boot_test.py --arch x86_64 \
            --kernel ${{ matrix.artifact }}/aprisma.kernel --timeout 120 --check-serial --shell user \
            --run "ls /etc" "motd +[0-9]+ bytes" \
            --run "args one 'two three'" "argv\[2\]=two three" \
            --run "cat /etc/motd" "Welcome to AprismaOS!" \
            --run "sort /etc/motd" "This file was read.*\nWelcome to AprismaOS!" \
            --run "cat /etc/motd | sort" "This file was read.*\nWelcome to AprismaOS!" \
            --run "sort < /etc/motd" "This file was read.*\nWelcome to AprismaOS!" \
            --run "ls /bin | wc" "(?m)^[0-9]+ [0-9]+ [0-9]+$" \
            --run "echo 'echo inner' | sh" '(?m)^inner\n\$' \
            --run "ls /bin > /tmp/list" 'ls /bin > /tmp/list\n\$' \
            --run "echo extra >> /tmp/list" 'echo extra >> /tmp/list\n\$' \
            --run "sort < /tmp/list | wc" "(?m)^[0-9]+ [0-9]+ [0-9]+$" \
            --run "cp /bin/hello /tmp" 'cp /bin/hello /tmp\n\$' \
            --run "/tmp/hello" "Hello from user mode" \
            --run "echo x > /etc/motd" "read-only" \
            --run "nope" "sh: nope: command not found" \
            --run "exit 3" "/bin/sh exited with code 3" \
            --run "version" "AprismaOS v[^ ]+ \(x86_64\)"

      # Keyboard and command-line behaviour (key presses sent through QMP)
      - name: Keyboard test ${{ matrix.artifact }}
        if: ${{ !matrix.is_iso }}
        run: |
          python3 scripts/qemu_keyboard_test.py --arch ${{ matrix.arch }} \
            --kernel ${{ matrix.artifact }}/aprisma.kernel --timeout 60

      # Booting without a ramdisk must work (the filesystem is optional)
      - name: Boot test without ramdisk ${{ matrix.artifact }}
        if: ${{ !matrix.is_iso }}
        run: |
          python3 scripts/qemu_boot_test.py --arch ${{ matrix.arch }} \
            --kernel ${{ matrix.artifact }}/aprisma.kernel --timeout 120 --no-initrd \
            --run "ls" "no filesystem" --run "echo still works" "(?m)^still works$"

      # The serial console must not hang a machine that has no serial port
      - name: Boot test without serial port ${{ matrix.artifact }}
        if: ${{ !matrix.is_iso }}
        run: |
          python3 scripts/qemu_boot_test.py --arch ${{ matrix.arch }} \
            --kernel ${{ matrix.artifact }}/aprisma.kernel --timeout 120 --no-serial \
            --run "echo still works" "(?m)^still works$"

      # Booting must not hang when there is no keyboard controller. Kernels
      # only: GRUB's menu itself needs a keyboard to continue.
      - name: Boot test without PS/2 controller ${{ matrix.artifact }}
        if: ${{ !matrix.is_iso }}
        run: |
          python3 scripts/qemu_boot_test.py --arch ${{ matrix.arch }} \
            --kernel ${{ matrix.artifact }}/aprisma.kernel --timeout 120 \
            --qemu-arg=-machine --qemu-arg=pc,i8042=off \
            --boot-done "No PS/2 controller found"

      # Optional: Quick disk image metadata check (works for both ISO and kernel images)
      - name: Inspect disk/image metadata
        run: |
          FILE=${{ matrix.is_iso && format('{0}/aprisma.iso', matrix.artifact) || format('{0}/aprisma.kernel', matrix.artifact) }}
          echo "📊 Image metadata:"
          qemu-img info "$FILE" || echo "⚠️ qemu-img could not read image metadata"

